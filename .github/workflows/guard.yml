# Blocks any pull request that changes files outside the blog.
#
# Publishing a post may touch only:
#   blog/<slug>/index.html   blog/index.html   blog/images/**   sitemap.xml
#
# Anything else — the homepage, assets/, _headers, _redirects, robots.txt,
# the post template, the playbook, this workflow — fails the check.
#
# Make it binding: Settings > Rules > Rulesets > main-guard
#   [x] Require a pull request before merging   (approvals: 0)
#   [x] Require status checks to pass  ->  add "guard"
#   Bypass list: empty
#
# Unlike "require Code Owner review", a required status check enforces the
# same way regardless of how many approvals are configured, so blog posts
# still merge with zero humans while everything else is stopped dead.

name: guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check which paths changed
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed=$(git diff --name-only "$base" "$head")

          echo "Files changed in this pull request:"
          echo "$changed" | sed 's/^/  /'
          echo

          blocked=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # The template shapes every future post — protect it even
              # though it sits inside blog/.
              blog/_TEMPLATE.html) blocked="${blocked}  ${f}"$'\n' ;;

              # Allowed: posts, the card grid, hero images, the sitemap.
              blog/*)              ;;
              sitemap.xml)         ;;

              # Everything else is out of bounds.
              *)                   blocked="${blocked}  ${f}"$'\n' ;;
            esac
          done <<< "$changed"

          if [ -n "$blocked" ]; then
            echo "BLOCKED — these files are outside the blog:"
            echo "$blocked"
            echo "Publishing a post may only change:"
            echo "  blog/<slug>/index.html, blog/index.html, blog/images/**, sitemap.xml"
            echo
            echo "If this change is intended, it needs its own pull request and a human."
            exit 1
          fi

          echo "OK — every changed file is inside the blog."
