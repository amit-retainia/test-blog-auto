<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Upload Blog Image | Dobby Ads</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.up-wrap{max-width:640px;margin:0 auto;padding:120px 1.5rem 80px}
.drop{border:2px dashed var(--bdr2);border-radius:16px;padding:3.5rem 2rem;text-align:center;cursor:pointer;transition:border-color .18s,background .18s;background:var(--s3)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-dim)}
.drop h2{font-size:1.25rem;font-weight:700;margin-bottom:.5rem}
.drop p{font-size:.95rem;color:rgba(255,255,255,.55)}
.bar{height:4px;background:var(--bdr2);border-radius:2px;overflow:hidden;margin-top:1.5rem;display:none}
.bar.on{display:block}
.bar span{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.out{display:none;margin-top:2rem;background:var(--s3);border:1px solid var(--acc-bdr);border-radius:12px;padding:1.5rem}
.out.on{display:block}
.out label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:.6rem}
.url{width:100%;background:#000;border:1px solid var(--bdr2);border-radius:6px;color:var(--acc);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;padding:.75rem;word-break:break-all;resize:none;min-height:64px}
.out img{margin-top:1.25rem;border-radius:8px;border:1px solid var(--bdr2)}
.msg{margin-top:1.25rem;font-size:.9rem;padding:.85rem 1rem;border-radius:8px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.35);color:#ff9c9c}
.setup{background:var(--s3);border:1px solid var(--acc-bdr);border-radius:12px;padding:1.75rem;font-size:.95rem;line-height:1.75}
.setup h2{font-size:1.1rem;font-weight:700;margin-bottom:.75rem;color:var(--acc)}
.setup ol{padding-left:1.25rem;list-style:decimal}
.setup li{margin-bottom:.5rem}
.setup code{background:#000;border:1px solid var(--bdr2);border-radius:4px;padding:.1rem .4rem;font-family:ui-monospace,monospace;font-size:.85em;color:var(--acc)}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo"><img src="/logo.webp" alt="Dobby Ads" class="logo-img"></a>
  <ul class="nav-links"><li><a href="/blog">Blog</a></li></ul>
  <div class="nav-right">
    <button class="hamburger" id="hb" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>
<div id="mob-menu"><a href="/blog">Blog</a></div>

<div class="up-wrap">
  <div class="sec-label">STEP 1</div>
  <h1 style="font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.75rem">Upload blog hero image</h1>
  <p style="color:rgba(255,255,255,.6);margin-bottom:2.5rem">Drop the image, copy the URL, paste it into Claude. That is the whole job.</p>

  <div id="app"></div>
</div>

<script src="/assets/site.js"></script>
<script>
/* ---------------------------------------------------------------------------
   CONFIG — set these two values once, then never again.

   Get them from Cloudinary (free account):
     CLOUD_NAME     Dashboard, shown as "Cloud name"
     UPLOAD_PRESET  Settings > Upload > Upload presets > Add
                    Signing mode MUST be "Unsigned"

   Unsigned means this page carries no API key and no secret. Nothing here is
   sensitive, nothing expires. Safe to serve publicly.
--------------------------------------------------------------------------- */
var CLOUD_NAME    = 'PASTE_CLOUD_NAME_HERE';
var UPLOAD_PRESET = 'PASTE_UPLOAD_PRESET_HERE';
var FOLDER        = 'dobby-blog';
var MAX_MB        = 10;

var app = document.getElementById('app');

if (CLOUD_NAME.indexOf('PASTE_') === 0 || UPLOAD_PRESET.indexOf('PASTE_') === 0) {
  app.innerHTML =
    '<div class="setup">' +
      '<h2>Not configured yet</h2>' +
      '<p style="color:rgba(255,255,255,.7);margin-bottom:1rem">Two values need filling in at the top of <code>upload.html</code>. One-time, five minutes.</p>' +
      '<ol>' +
        '<li>Create a free account at <a href="https://cloudinary.com" target="_blank" rel="noopener" style="color:var(--acc)">cloudinary.com</a>.</li>' +
        '<li>Copy the <strong>Cloud name</strong> from the dashboard into <code>CLOUD_NAME</code>.</li>' +
        '<li>Go to <strong>Settings &rsaquo; Upload &rsaquo; Upload presets &rsaquo; Add upload preset</strong>.</li>' +
        '<li>Set <strong>Signing mode</strong> to <code>Unsigned</code>. Save.</li>' +
        '<li>Copy the preset name into <code>UPLOAD_PRESET</code>. Commit the file.</li>' +
      '</ol>' +
    '</div>';
} else {
  app.innerHTML =
    '<div class="drop" id="drop" role="button" tabindex="0">' +
      '<h2>Drop image here</h2>' +
      '<p>or click to choose &nbsp;&middot;&nbsp; JPG, PNG or WebP &nbsp;&middot;&nbsp; max ' + MAX_MB + 'MB</p>' +
      '<input type="file" id="file" accept="image/*" hidden>' +
    '</div>' +
    '<div class="bar" id="bar"><span id="fill"></span></div>' +
    '<div class="msg err" id="err"></div>' +
    '<div class="out" id="out">' +
      '<label>Image URL — paste this into Claude</label>' +
      '<textarea class="url" id="url" readonly onclick="this.select()"></textarea>' +
      '<button class="btn-primary" id="copy" style="margin-top:1rem">Copy URL</button>' +
      '<img id="prev" alt="Uploaded preview">' +
    '</div>';
  wire();
}

function wire() {
  var drop = document.getElementById('drop'),
      file = document.getElementById('file'),
      bar  = document.getElementById('bar'),
      fill = document.getElementById('fill'),
      out  = document.getElementById('out'),
      url  = document.getElementById('url'),
      prev = document.getElementById('prev'),
      err  = document.getElementById('err'),
      copy = document.getElementById('copy');

  function fail(m) { err.textContent = m; err.classList.add('on'); bar.classList.remove('on'); }
  function clearFail() { err.classList.remove('on'); }

  drop.addEventListener('click', function () { file.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); }
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files && e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);
  });
  file.addEventListener('change', function () { if (file.files[0]) send(file.files[0]); });

  copy.addEventListener('click', function () {
    url.select();
    navigator.clipboard.writeText(url.value).then(function () {
      copy.textContent = 'Copied';
      setTimeout(function () { copy.textContent = 'Copy URL'; }, 1800);
    });
  });

  function send(f) {
    clearFail();
    out.classList.remove('on');

    if (f.type.indexOf('image/') !== 0) return fail('That is not an image file.');
    if (f.size > MAX_MB * 1024 * 1024) {
      return fail('Image is ' + (f.size / 1048576).toFixed(1) + 'MB. Limit is ' + MAX_MB + 'MB.');
    }

    var data = new FormData();
    data.append('file', f);
    data.append('upload_preset', UPLOAD_PRESET);
    data.append('folder', FOLDER);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload');

    bar.classList.add('on');
    fill.style.width = '0%';

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 92) + '%';
    };

    xhr.onload = function () {
      var res;
      try { res = JSON.parse(xhr.responseText); } catch (_) { res = null; }

      if (xhr.status < 200 || xhr.status >= 300 || !res || !res.secure_url) {
        var why = res && res.error && res.error.message ? res.error.message : 'HTTP ' + xhr.status;
        return fail('Upload failed: ' + why);
      }

      fill.style.width = '100%';

      /* Insert f_auto,q_auto so Cloudinary serves webp/avif at the right
         quality per browser. Cheaper and faster than a fixed .webp file. */
      var optimized = res.secure_url.replace('/upload/', '/upload/f_auto,q_auto/');

      url.value = optimized;
      prev.src = optimized;
      out.classList.add('on');
      setTimeout(function () { bar.classList.remove('on'); }, 600);
    };

    xhr.onerror = function () { fail('Network error. Check your connection and try again.'); };
    xhr.send(data);
  }
}
</script>
</body>
</html>
